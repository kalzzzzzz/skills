<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 整页底图：包含顶部/底部纹样条、中国中药Logo、左侧红色竖条 -->
  <image x="0" y="0" width="1280" height="720" href="bg_chapter.png" preserveAspectRatio="none"/>

  <!-- 章节编号和标题 - 在右侧白色区域 -->
  <text x="160" y="280" font-family="微软雅黑, Microsoft YaHei, sans-serif" font-size="48" font-weight="bold" fill="#1A1A1A">{{CHAPTER_NUM}}</text>

  <text x="160" y="340" font-family="微软雅黑, Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#1A1A1A">{{CHAPTER_TITLE}}</text>
</svg>